name: Linker inputs

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build and attest the exact candidate selected by the trusted publisher
        required: true
        default: false
        type: boolean
      expected_sha:
        description: Exact pull-request head selected by the trusted publisher
        required: false
        type: string

permissions: {}
concurrency:
  group: linker-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Bind publication candidates to the dispatched commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate || false }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CANDIDATE" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test -n "$EXPECTED_SHA"
            test "$EXPECTED_SHA" = "$GITHUB_SHA"
          fi

  build:
    needs: validate-request
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x64musl
          - os: macos-26
            target: arm64mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read tool versions
        id: dependencies
        run: echo "zig-version=$(jq -r .zig_version scripts/workspace-deps.json)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.dependencies.outputs.zig-version }}
          use-cache: false
      - name: Install Roc toolchains
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: nightly-2026-09-18-1d982dc
          nightly-tag: nightly-2026-09-22-e494788
      - name: Build linker inputs from source
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: scripts/build_platform.roc -- --target ${{ matrix.target }} --libraries source --libraries-only
      - name: Validate inputs through a fresh host and final bundle
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: |
          scripts/build_platform.roc -- --target ${{ matrix.target }} --host-only
          scripts/build_bundle.roc -- --target ${{ matrix.target }} --output-dir "$RUNNER_TEMP/bundle"
          scripts/test_bundle.roc -- "$RUNNER_TEMP"/bundle/*.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: built-${{ matrix.target }}
          path: platform/targets/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: built-*
          path: built
      - name: Restore target layouts
        run: |
          cp -R built/built-x64musl/. platform/targets/x64musl/
          cp -R built/built-arm64mac/. platform/targets/arm64mac/
      - name: Create deterministic target archives and canonical manifest
        run: >-
          python3 scripts/link_input_artifacts.py package
          --output candidate
          --repository "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA"
          --ref "$GITHUB_REF"
          --workflow "$GITHUB_REPOSITORY/.github/workflows/native-libraries.yml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: link-input-release
          path: candidate/*
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: assemble
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: link-input-release
          path: candidate
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: candidate/build-input-release.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: candidate/link-inputs-*.tar
