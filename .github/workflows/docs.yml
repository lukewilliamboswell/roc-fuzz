name: Documentation

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read compiler selections
        id: compilers
        shell: bash
        run: |
          echo "stable=$(jq -er .roc_stable scripts/workspace-deps.json)" >> "$GITHUB_OUTPUT"
          echo "nightly=$(jq -er .roc_nightly scripts/workspace-deps.json)" >> "$GITHUB_OUTPUT"

      - name: Install the selected tooling and project compilers
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: ${{ steps.compilers.outputs.stable }}
          nightly-tag: ${{ steps.compilers.outputs.nightly }}

      - name: Verify installed compiler versions
        shell: bash
        env:
          STABLE_EXE: ${{ steps.roc.outputs.stable-executable }}
          NIGHTLY_EXE: ${{ steps.roc.outputs.nightly-executable }}
          EXPECT_STABLE: ${{ steps.compilers.outputs.stable }}
          EXPECT_NIGHTLY: ${{ steps.compilers.outputs.nightly }}
        run: |
          test "$("$STABLE_EXE" version)" = "Roc compiler version $EXPECT_STABLE"
          test "$("$NIGHTLY_EXE" version)" = "Roc compiler version $EXPECT_NIGHTLY"

      - id: docs
        name: Build HTML, PDF, and API documentation
        uses: lukewilliamboswell/roc-automation/actions/build-docs@a2b4d8abc967952b59fc751345efd144cbc0fbfc # a2b4d8a
        with:
          pdf-filename: roc-fuzz.pdf
          docs-version: trunk
          api-entrypoint: platform/main.roc
          roc-command: ${{ steps.roc.outputs.nightly-executable }}

      - name: Audit the generated API reference
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: scripts/check_docs.roc -- "${{ steps.docs.outputs.site-directory }}/api"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.docs.outputs.site-directory }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
