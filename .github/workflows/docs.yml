name: Documentation

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install checksum-pinned Roc nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          roc_bin_dir="$(python3 scripts/install_roc.py --install-dir "$RUNNER_TEMP/roc-nightly")"
          echo "$roc_bin_dir" >> "$GITHUB_PATH"

      - id: docs
        name: Build HTML, PDF, and API documentation
        uses: lukewilliamboswell/roc-automation/actions/build-docs@b432f89a4338e4f685a8301f4f0be489bfe049e4 # b432f89
        with:
          pdf-filename: roc-fuzz.pdf
          docs-version: trunk
          api-entrypoint: platform/main.roc

      - name: Audit the generated API reference
        run: python3 scripts/check_docs.py "${{ steps.docs.outputs.site-directory }}/api"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.docs.outputs.site-directory }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
