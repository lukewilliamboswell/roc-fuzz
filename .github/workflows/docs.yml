name: Documentation

# Builds the manual and the API reference, assembles the site, and deploys it
# to GitHub Pages from trunk. The site leads with the latest release, whose
# documentation is restored from the archive that release published; the
# working tree's documentation sits under unreleased/. A pull request builds
# everything and deploys nothing. release.yml calls this workflow after it
# publishes, because a new release changes what the site leads with.
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One run uses one compiler: the tag is resolved here and passed to every job.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6 # tools-0.4.0
        with:
          install-nix: 'true'

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}

      - id: renderer
        name: Locate the roc-docs renderer Blueprint.lock pins
        uses: lukewilliamboswell/roc-automation/actions/blueprint-tool@7aff4132691ad4fc348abe9df146a57512b49bd6 # tools-0.4.0
        with:
          task: docs-path
          label: roc-docs tools-0.4.0

      - id: docs
        name: Build the working tree's HTML, PDF, and API documentation
        uses: lukewilliamboswell/roc-automation/actions/build-docs@7aff4132691ad4fc348abe9df146a57512b49bd6 # tools-0.4.0
        with:
          renderer-binary: ${{ steps.renderer.outputs.binary }}
          site-url: https://lukewilliamboswell.github.io/roc-fuzz/unreleased/
          pdf-filename: roc-fuzz.pdf
          docs-version: unreleased
          api-entrypoint: platform/main.roc
          roc-command: roc

      - name: Audit the generated API reference
        run: blueprint run check-docs -- "${{ steps.docs.outputs.site-directory }}/api"

      - name: Assemble the site around the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ steps.docs.outputs.site-directory }}
        run: blueprint run site -- --working-tree-site "$SITE" --output "$RUNNER_TEMP/pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
