name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [trunk]
  schedule:
    - cron: "41 13 * * 3"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Supply-chain analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload result to code scanning
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          sarif_file: scorecard-results.sarif

      - name: Retain machine-readable result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          if-no-files-found: error
          retention-days: 30
