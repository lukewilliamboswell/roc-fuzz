name: Publish linker inputs

on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: Same-repository pull request containing the material linker-input change
        required: true
        type: string

permissions: {}
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      attestations: read
      contents: write
      pull-requests: read
    steps:
      - name: Publish the exact attested PR candidate and adopt its lock
        uses: lukewilliamboswell/roc-automation/actions/publish-build-inputs@26f35e78f19c761b0160768f267e321dbccac3c7 # 26f35e7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          pull-request: ${{ inputs.pull-request }}
          producer-workflow: native-libraries.yml
          candidate-artifact: link-input-release
          lock-path: native-libraries.lock.json
          release-prefix: linker-inputs
