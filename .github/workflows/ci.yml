name: CI

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a nightly candidate without publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-examples:
    name: Public downloads (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
      - name: Test committed URLs from a fresh cache
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: >-
          "$ROC_STABLE" --opt=dev scripts/test_targets.roc --
          --operation all --max-total-time 1 --verbose

  self-contained-runner:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform-target: x64musl
          - os: macos-26
            platform-target: arm64mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout roc-fuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read workspace dependencies
        id: dependencies
        run: echo "zig-version=$(jq -r .zig_version scripts/workspace-deps.json)" >> "$GITHUB_OUTPUT"

      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.dependencies.outputs.zig-version }}

      - name: Show tool versions
        run: |
          "$ROC_STABLE" version
          "$ROC_NIGHTLY" version
          zig version
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}

      - name: Build native inputs for the working-tree platform
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        # Bootstrap only: switch to release when the first native-library lock is adopted.
        run: scripts/build_platform.roc -- --target ${{ matrix.platform-target }} --libraries source

      - name: Validate the repository
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: scripts/check_all.roc

      - name: Test examples against the working-tree platform
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: |
          scripts/build_bundle.roc -- --target ${{ matrix.platform-target }} --output-dir .test-cache/ci-bundle
          scripts/test_bundle.roc -- .test-cache/ci-bundle/*.tar.zst

      - name: Generate and validate API documentation
        env:
          ROC_DOCS_URL_ROOT: /roc-fuzz/main
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: |
          "$ROC_NIGHTLY" docs --output=.test-cache/docs platform/main.roc
          scripts/check_docs.roc -- .test-cache/docs

  required:
    name: CI required
    if: always()
    needs: [self-contained-runner, published-examples]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every CI matrix job
        env:
          MATRIX_RESULT: ${{ needs.self-contained-runner.result }}
          PUBLIC_RESULT: ${{ needs.published-examples.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$PUBLIC_RESULT" = success
