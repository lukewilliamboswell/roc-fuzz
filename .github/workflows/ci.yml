name: CI

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-contained-runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout roc-fuzz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Roc nightly
        id: roc-version
        run: |
          set -euo pipefail
          tag="$(sed -n '1p' .roc-version)"
          if [ -z "$tag" ] || [ "$(wc -l < .roc-version)" -ne 1 ]; then
            echo ".roc-version must contain exactly one nightly tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install pinned Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.tag }}

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Show tool versions
        run: |
          roc version
          zig version
          python --version

      - name: Validate target sources
        run: python scripts/test.py --operation validate --verbose

      - name: Generate and validate API documentation
        env:
          ROC_DOCS_URL_ROOT: /roc-fuzz/main
        run: |
          roc docs --output=.test-cache/docs platform/main.roc
          python scripts/check_docs.py .test-cache/docs

      - name: Build every self-contained target
        run: python scripts/test.py --operation build --verbose

      - name: Smoke-test libFuzzer and failure artifacts
        run: python scripts/test.py --operation fuzz --max-total-time 1 --verbose

  ci-required:
    name: CI required
    if: always()
    needs: [self-contained-runner]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          if not results or any(job["result"] != "success" for job in results.values()):
              raise SystemExit("Required validation did not pass")
          PYTHON
