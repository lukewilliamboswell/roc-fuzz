name: CI

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a nightly candidate without publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sanitizers:
    name: Native sanitizers
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout roc-fuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install and verify workspace compilers
        id: roc
        uses: ./.github/actions/setup-workspace-roc

      - name: Build and run the pinned libFuzzer with AddressSanitizer
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
        run: |
          roc-stable scripts/test_native_sanitizers.roc

  published-release:
    name: Select published compatibility baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install workspace compilers
        uses: ./.github/actions/setup-workspace-roc
      - name: Resolve one release and compiler for both hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          roc-stable scripts/release_examples.roc -- --operation resolve --repository "$GITHUB_REPOSITORY" \
            --compiler "$(jq -er .roc_nightly scripts/workspace-deps.json)" \
            --output .release/published-selection.json
          cat .release/published-selection.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-selection
          path: .release/published-selection.json
          if-no-files-found: error

  published-examples:
    name: Published release compatibility (${{ matrix.os }})
    needs: published-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install and verify workspace compilers
        id: roc
        uses: ./.github/actions/setup-workspace-roc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-selection
          path: .release
      - name: Fetch the frozen release examples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -er .compiler .release/published-selection.json)" = "$(jq -er .roc_nightly scripts/workspace-deps.json)"
          roc-stable scripts/release_examples.roc -- --operation fetch --selection .release/published-selection.json --output .release/published-suite
      - name: Build and exercise published examples on this host
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
          XDG_CACHE_HOME: ${{ runner.temp }}/roc-published-cache
        run: >-
          roc-stable scripts/test_targets.roc -- --suite-root .release/published-suite
          --operation all --max-total-time 1 --verbose
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-${{ matrix.os }}
          path: .release/published-suite/compatibility.json
          if-no-files-found: error

  self-contained-runner:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform-target: x64musl
          - os: macos-26
            platform-target: arm64mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout roc-fuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read workspace dependencies
        id: dependencies
        run: echo "zig-version=$(jq -r .zig_version scripts/workspace-deps.json)" >> "$GITHUB_OUTPUT"

      - name: Install and verify workspace compilers
        id: roc
        uses: ./.github/actions/setup-workspace-roc

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.dependencies.outputs.zig-version }}

      - name: Show tool versions
        run: |
          "$ROC_STABLE" version
          "$ROC_NIGHTLY" version
          zig version
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}

      - name: Resolve the reviewed linker-input identity
        id: linker-inputs
        env:
          TARGET: ${{ matrix.platform-target }}
        run: |
          identity=$(roc-stable scripts/link_input_artifacts.roc -- --operation cache-identity --target "$TARGET")
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Restore the content-addressed linker-input download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-cache/native-libraries
          key: linker-inputs-${{ matrix.platform-target }}-${{ steps.linker-inputs.outputs.identity }}

      - name: Prepare host and reviewed linker inputs
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
          TARGET: ${{ matrix.platform-target }}
        run: scripts/build_platform.roc -- --target "$TARGET"

      - name: Validate the repository
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: scripts/check_all.roc

      - name: Exercise local examples against the working-tree platform
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: roc-stable scripts/test_targets.roc -- --operation all --max-total-time 1

      - name: Test examples against the packaged working-tree platform
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: |
          scripts/build_bundle.roc -- --target ${{ matrix.platform-target }} --output-dir .test-cache/ci-bundle
          scripts/test_bundle.roc -- .test-cache/ci-bundle/*.tar.zst

      - name: Generate and validate API documentation
        env:
          ROC_DOCS_URL_ROOT: /roc-fuzz/main
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: |
          "$ROC_NIGHTLY" docs --output=.test-cache/docs platform/main.roc
          scripts/check_docs.roc -- .test-cache/docs

  required:
    name: CI required
    if: always()
    needs: [native-sanitizers, self-contained-runner, published-release, published-examples]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every CI matrix job
        env:
          MATRIX_RESULT: ${{ needs.self-contained-runner.result }}
          SANITIZER_RESULT: ${{ needs.native-sanitizers.result }}
          PUBLIC_RESULT: ${{ needs.published-examples.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$SANITIZER_RESULT" = success
          test "$PUBLIC_RESULT" = success
