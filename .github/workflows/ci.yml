name: CI

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One run uses one compiler: the tag is resolved here and passed to every job.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  native-sanitizers:
    name: Native sanitizers
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout roc-fuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.0"
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743

      - name: Build and run the pinned libFuzzer with AddressSanitizer
        run: |
          blueprint run native-sanitizers

  published-release:
    name: Select published compatibility baseline
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.0"
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743
      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - name: Resolve one release and compiler for both hosts
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly-tag }}
        run: |
          blueprint run release-examples -- --operation resolve --repository "$GITHUB_REPOSITORY" \
            --compiler "$NIGHTLY_TAG" \
            --output .release/published-selection.json
          cat .release/published-selection.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-selection
          path: .release/published-selection.json
          if-no-files-found: error

  published-examples:
    name: Published release compatibility (${{ matrix.os }})
    needs: [resolve, published-release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.0"
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743
      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-selection
          path: .release
      - name: Fetch the frozen release examples
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly-tag }}
        run: |
          test "$(jq -er .compiler .release/published-selection.json)" = "$NIGHTLY_TAG"
          blueprint run release-examples -- --operation fetch --selection .release/published-selection.json --output .release/published-suite
      - name: Build and exercise published examples on this host
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/roc-published-cache
        run: >-
          blueprint run test-targets -- --suite-root .release/published-suite
          --operation all --max-total-time 1 --verbose
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-${{ matrix.os }}
          path: .release/published-suite/compatibility.json
          if-no-files-found: error

  self-contained-runner:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform-target: x64musl
          - os: macos-26
            platform-target: arm64mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout roc-fuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read workspace dependencies
        id: dependencies
        run: echo "zig-version=$(jq -r .zig_version scripts/native-deps.json)" >> "$GITHUB_OUTPUT"

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.0"
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743
      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.dependencies.outputs.zig-version }}

      - name: Show tool versions
        run: |
          blueprint run stable-version
          roc version
          zig version

      - name: Resolve the reviewed linker-input identity
        id: linker-inputs
        env:
          TARGET: ${{ matrix.platform-target }}
        run: |
          identity=$(blueprint run link-inputs -- --operation cache-identity --target "$TARGET")
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Restore the content-addressed linker-input download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-cache/native-libraries
          key: linker-inputs-${{ matrix.platform-target }}-${{ steps.linker-inputs.outputs.identity }}

      - name: Prepare host and reviewed linker inputs
        env:
          TARGET: ${{ matrix.platform-target }}
        run: blueprint run build-platform -- --target "$TARGET"

      - name: Validate the repository
        run: blueprint run check

      - name: Exercise local examples against the working-tree platform
        run: blueprint run test-targets -- --operation all --max-total-time 1

      - name: Test examples against the packaged working-tree platform
        run: |
          blueprint run bundle -- --target ${{ matrix.platform-target }} --output-dir .test-cache/ci-bundle
          blueprint run test-bundle -- .test-cache/ci-bundle/*.tar.zst

      - name: Generate and validate API documentation
        env:
          ROC_DOCS_URL_ROOT: /roc-fuzz/main
        run: |
          roc docs --output=.test-cache/docs platform/main.roc
          blueprint run check-docs -- .test-cache/docs

  required:
    name: CI required
    if: always()
    needs: [native-sanitizers, self-contained-runner, published-release, published-examples]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every CI matrix job
        env:
          MATRIX_RESULT: ${{ needs.self-contained-runner.result }}
          SANITIZER_RESULT: ${{ needs.native-sanitizers.result }}
          PUBLIC_RESULT: ${{ needs.published-examples.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$SANITIZER_RESULT" = success
          test "$PUBLIC_RESULT" = success
