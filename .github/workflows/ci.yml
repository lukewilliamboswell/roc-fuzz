name: CI

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a nightly candidate without publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-contained-runner:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform-target: x64musl
          - os: macos-26
            platform-target: arm64mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout roc-fuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install checksum-pinned Roc nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          roc_bin_dir="$(python3 scripts/install_roc.py --install-dir "$RUNNER_TEMP/roc-nightly")"
          echo "$roc_bin_dir" >> "$GITHUB_PATH"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Show tool versions
        run: |
          roc version
          zig version
          python --version

      - name: Validate supply-chain metadata
        run: python scripts/check_supply_chain.py

      - name: Test examples against the working-tree platform package
        env:
          GH_TOKEN: ${{ github.token }}
        # Bootstrap only: switch to release when the first native-library lock is adopted.
        run: python scripts/test_local.py --libraries source --platform-target ${{ matrix.platform-target }} --operation all --max-total-time 1 --verbose

      - name: Test release tooling
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Generate and validate API documentation
        env:
          ROC_DOCS_URL_ROOT: /roc-fuzz/main
        run: |
          roc docs --output=.test-cache/docs platform/main.roc
          python scripts/check_docs.py .test-cache/docs

  required:
    name: CI required
    if: always()
    needs: self-contained-runner
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every CI matrix job
        env:
          MATRIX_RESULT: ${{ needs.self-contained-runner.result }}
        run: test "$MATRIX_RESULT" = success
