name: Deploy docs to Pages

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/deploy-docs.yml"
      - "docs/**"
      - "platform/**"
      - "scripts/check_docs.py"
      - "scripts/restore_release_docs.sh"
  workflow_dispatch:
  workflow_call:
    inputs:
      docs_artifact:
        description: Docs archive artifact from the calling release workflow
        required: false
        default: ""
        type: string
      docs_version:
        description: Version directory contained in the docs archive
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        if: inputs.docs_artifact == ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install checksum-pinned Roc nightly
        env:
          GH_TOKEN: ${{ github.token }}
        if: inputs.docs_artifact == ''
        run: |
          roc_bin_dir="$(python3 scripts/install_roc.py --install-dir "$RUNNER_TEMP/roc-nightly")"
          echo "$roc_bin_dir" >> "$GITHUB_PATH"

      - name: Restore released docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/restore_release_docs.sh www

      - name: Download versioned docs archive
        if: inputs.docs_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.docs_artifact }}

      - name: Snapshot existing docs
        if: inputs.docs_artifact != ''
        uses: roc-lang/release-package/actions/docs-snapshot@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          docs_root: www

      - name: Install versioned docs archive
        if: inputs.docs_artifact != ''
        run: tar -xzf docs.tar.gz -C www

      - name: Update docs index
        if: inputs.docs_artifact != ''
        uses: roc-lang/release-package/actions/docs-index@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          docs_root: www
          docs_version: ${{ inputs.docs_version }}

      - name: Generate main branch docs
        if: inputs.docs_artifact == ''
        env:
          ROC_DOCS_URL_ROOT: /${{ github.event.repository.name }}/main
        run: |
          roc docs --output=www/main platform/main.roc
          python3 scripts/check_docs.py www/main

      - name: Validate versioned docs
        if: inputs.docs_artifact != ''
        uses: roc-lang/release-package/actions/docs-validate@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          docs_root: www
          docs_version: ${{ inputs.docs_version }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: www

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
