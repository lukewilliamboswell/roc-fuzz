name: Publish link inputs

on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: Same-repository pull request containing the material linker-input change
        required: true
        type: string
      producer-run:
        description: Existing successful producer run for the current PR head, for recovery; empty dispatches a new run
        required: false
        default: ""
        type: string

permissions: {}
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      attestations: read
      contents: write
      pull-requests: read
    steps:
      - name: Publish the exact attested PR candidate and adopt its lock
        uses: lukewilliamboswell/roc-automation/actions/publish-build-inputs@a25b5129340b9b2ad1744d20330b8ee4d38a1849 # a25b512
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          pull-request: ${{ inputs.pull-request }}
          producer-workflow: link-inputs.yml
          producer-run: ${{ inputs.producer-run }}
          candidate-artifact: link-input-release
          lock-path: native-libraries.lock.json
          release-prefix: linker-inputs
