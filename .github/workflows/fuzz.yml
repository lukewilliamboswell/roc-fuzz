name: Fuzz builtins

# A bounded daily search of the builtin targets on the latest Roc nightly. A
# new nightly can change how a builtin behaves without any change here, and
# neither pull-request smoke runs nor the published examples search for long
# enough to notice. Each target fuzzes for a few seconds from the corpus the
# previous run left in the Actions cache, about ten minutes in all. A target
# that fails keeps its input as an artifact; reproduce it with `replay`, not
# with the seed. This workflow never commits, opens issues or publishes.
on:
  schedule:
    # Daily, after the Nightly compatibility run.
    - cron: "47 14 * * *"
  workflow_dispatch:
    inputs:
      nightly-tag:
        description: Roc nightly to search with; empty uses the latest
        required: false
        default: ""
        type: string
      seconds:
        description: Seconds each target fuzzes
        required: false
        default: "8"
        type: string

permissions: {}

concurrency:
  group: fuzz-builtins
  cancel-in-progress: false

jobs:
  campaign:
    name: Search the builtin targets
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CAMPAIGN: ${{ github.workspace }}/.test-cache/campaign
    steps:
      - name: Checkout roc-fuzz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6 # tools-0.4.0
        with:
          install-nix: 'true'

      - id: nightly
        name: Resolve the Roc nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.nightly-tag }}
        run: |
          tag="${REQUESTED:-$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install that nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.nightly.outputs.tag }}

      - name: Restore the content-addressed linker-input download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-cache/native-libraries
          key: linker-inputs-${{ hashFiles('native-libraries.lock.json') }}

      - name: Restore Zig's compilation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ hashFiles('Blueprint.lock', 'scripts/native-deps.json', 'scripts/build_platform.roc', 'src/**') }}
          restore-keys: zig-${{ runner.os }}-

      # Caches are immutable, so each run saves under its own key and the next
      # restores the newest. A missing cache starts a new search; it never
      # excuses a missing target.
      - name: Restore the evolving corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-cache/campaign/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Build the host around the reviewed linker inputs
        run: blueprint run build-platform -- --target x64musl

      - id: targets
        name: Select the builtin targets
        run: |
          targets=$(jq -r '.cases[] | select((.path | startswith("tests/targets/builtins/")) and (.expected_failure | not) and (.skip_fuzz | not)) | .name' tests/targets.json)
          test -n "$targets"
          {
            echo "count=$(wc -l <<< "$targets")"
            echo "args=$(sed 's/^/--target /' <<< "$targets" | tr '\n' ' ')"
          } >> "$GITHUB_OUTPUT"

      - name: Fuzz each target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '8' }}
          TARGET_ARGS: ${{ steps.targets.outputs.args }}
        run: |
          # TARGET_ARGS holds only names from tests/targets.json.
          # shellcheck disable=SC2086
          blueprint run test-targets -- --operation fuzz --max-total-time "$SECONDS_PER_TARGET" \
            --campaign-dir "$CAMPAIGN" $TARGET_ARGS

      - name: Save the evolving corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-cache/campaign/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Keep the failing inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-failures
          path: .test-cache/campaign/failures
          if-no-files-found: ignore
          retention-days: 30

      - name: Record what ran
        if: always()
        env:
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
          COUNT: ${{ steps.targets.outputs.count }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '8' }}
        run: |
          {
            echo "## Builtin search"
            echo
            echo "- Nightly: \`$NIGHTLY_TAG\`"
            echo "- \`roc version\`: \`$(roc version)\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Targets: $COUNT, $SECONDS_PER_TARGET seconds each, on x64musl"
            echo "- Corpus inputs after the run: $(find "$CAMPAIGN/corpus" -type f 2>/dev/null | wc -l)"
            echo "- Failing inputs kept: $(find "$CAMPAIGN/failures" -type f 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
