name: Published examples
on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Test committed release URLs with the candidate compiler
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.policy.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether published compatibility changed
        id: policy
        run: python3 scripts/published_examples_policy.py
  examples:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install the examples' declared compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_supply_chain.py
          roc_bin_dir="$(python scripts/install_roc.py --tag-file examples/stack/main.roc --install-dir "$RUNNER_TEMP/roc")"
          echo "$roc_bin_dir" >> "$GITHUB_PATH"
      - name: Check, test, build, replay and fuzz committed published URLs
        # Fresh runner; no dependency-cache restore and no --platform-url rewrite.
        run: python scripts/test.py --operation all --max-total-time 1 --verbose
  required:
    name: Published examples required
    needs: [changes, examples]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          POLICY_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          RESULT: ${{ needs.examples.result }}
        run: |
          test "$POLICY_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$RESULT" = success
          else
            test "$REQUIRED" = false
            test "$RESULT" = skipped
            echo 'Published dependencies unchanged; source and candidate workflows validate this change.'
          fi
