name: Release follow-up
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing platform version to adopt (also supports retry after publication)
        required: true
        type: string
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
permissions: {}
jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      url: ${{ steps.asset.outputs.url }}
      digest: ${{ steps.asset.outputs.digest }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve the published platform archive
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
          test "$(jq -r .draft <<< "$release")" = false
          assets="$(jq '[.assets[] | select(.name | endswith(".tar.zst"))]' <<< "$release")"
          test "$(jq length <<< "$assets")" -eq 1
          digest="$(jq -r '.[0].digest' <<< "$assets")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "url=$(jq -r '.[0].browser_download_url' <<< "$assets")" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
  test:
    needs: resolve
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install declared example compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          roc_bin_dir="$(python scripts/install_roc.py --tag-file examples/stack/main.roc --install-dir "$RUNNER_TEMP/roc")"
          echo "$roc_bin_dir" >> "$GITHUB_PATH"
      - name: Verify published digest and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ needs.resolve.outputs.url }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
        run: |
          curl --fail --location "$URL" --output "$RUNNER_TEMP/platform.tar.zst"
          python -c 'import hashlib,os,pathlib; assert hashlib.sha256((pathlib.Path(os.environ["RUNNER_TEMP"])/"platform.tar.zst").read_bytes()).hexdigest() == os.environ["DIGEST"]'
          gh attestation verify "$RUNNER_TEMP/platform.tar.zst" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Test proposed URLs from a fresh consumer cache
        env:
          URL: ${{ needs.resolve.outputs.url }}
        run: python scripts/test.py --platform-url "$URL" --operation all --max-total-time 1
  follow-up:
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Create signed URL update and dispatch validation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
          URL: ${{ needs.resolve.outputs.url }}
        run: python scripts/release_followup.py --version "$VERSION" --url "$URL"
