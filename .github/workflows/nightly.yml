name: Nightly compatibility

# Answers one question each day: does the release people download today still
# work with today's compiler?
#
# It runs the examples archive attached to the latest platform release, exactly
# as published, on the latest Roc nightly, on every target the release supports.
# Nothing from the default branch is tested except the scripts that drive the
# run. A failure means the platform needs a patch release; this workflow never
# commits, merges or publishes.
on:
  schedule:
    # Once daily, about four hours after the upstream 09:00 UTC build.
    - cron: "28 13 * * *"
  workflow_dispatch:
    inputs:
      nightly-tag:
        description: Roc nightly to test with; empty uses the latest
        required: false
        default: ""
        type: string
      release-version:
        description: Platform release to test; empty uses the latest that is not a prerelease
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: nightly-compatibility
  cancel-in-progress: false

jobs:
  # One run tests one compiler against one release: both are chosen here.
  select:
    name: Select the compiler and the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: nightly
        name: Resolve the Roc nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.nightly-tag }}
        run: |
          tag="$REQUESTED"
          if [ -z "$tag" ]; then
            tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.1"
          sha256-x86_64-linux: 4ad2477b11211e963f4844554d909b939bd3419e94a8faec335ca619d41e37b6
          sha256-aarch64-linux: 7ba164c03bdda8323b1a8edb315ded20549f31b4683429a6a0f9e96ba9d12301
          sha256-aarch64-darwin: 7d9060a50c0e52960499ea6a4cb6aa5fd0bcccb14485d4c02829b56b4d8fcdaa

      # Linker-input releases share this repository; the script skips them and
      # every prerelease.
      - id: release
        name: Select the platform release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          blueprint run release-examples -- --operation resolve --repository "$GITHUB_REPOSITORY" \
            --compiler "$NIGHTLY_TAG" --release-version "$RELEASE_VERSION" \
            --output .release/published-selection.json
          echo "version=$(jq -er .version .release/published-selection.json)" >> "$GITHUB_OUTPUT"
          jq . .release/published-selection.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-selection
          path: .release/published-selection.json
          if-no-files-found: error

  test:
    name: Published release on ${{ matrix.os }}
    needs: select
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      # Set by whichever target reaches its examples, so the report can tell a
      # compatibility failure from a setup failure.
      ran: ${{ steps.ran.outputs.ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.1"
          sha256-x86_64-linux: 4ad2477b11211e963f4844554d909b939bd3419e94a8faec335ca619d41e37b6
          sha256-aarch64-linux: 7ba164c03bdda8323b1a8edb315ded20549f31b4683429a6a0f9e96ba9d12301
          sha256-aarch64-darwin: 7d9060a50c0e52960499ea6a4cb6aa5fd0bcccb14485d4c02829b56b4d8fcdaa

      - name: Install the Roc nightly this run selected
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.select.outputs.nightly-tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published-selection
          path: .release

      - name: Fetch the release's examples archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: blueprint run release-examples -- --operation fetch --selection .release/published-selection.json --output .release/published-suite

      - id: ran
        name: Record that the examples are about to run
        run: echo "ran=true" >> "$GITHUB_OUTPUT"

      # An empty package cache, so the published bundle is downloaded and
      # verified and not found from an earlier run.
      - name: Build and run the archived examples, unchanged
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/roc-published-cache
        run: >-
          blueprint run test-targets -- --suite-root .release/published-suite
          --operation all --max-total-time 1 --verbose

      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-${{ matrix.os }}
          path: .release/published-suite/compatibility.json
          if-no-files-found: ignore

  # Keeps one tracking issue: opened on the first failure, commented on by each
  # later failure, closed by the next pass. It checks out nothing and runs no
  # code from this repository or from a release. It receives job results and
  # the run link, never text the examples produced.
  report:
    name: Track the result in an issue
    needs: [select, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          SELECT_RESULT: ${{ needs.select.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RAN: ${{ needs.test.outputs.ran }}
          NIGHTLY_TAG: ${{ needs.select.outputs.nightly-tag }}
          RELEASE_VERSION: ${{ needs.select.outputs.release-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: The latest release fails on the latest Roc nightly
        run: |
          set -euo pipefail
          if [ "$TEST_RESULT" != success ] && [ "$RAN" != true ]; then
            echo "::error::Setup failed before any example ran (select: $SELECT_RESULT, test: $TEST_RESULT). This says nothing about compatibility, so the tracking issue is left alone."
            exit 1
          fi
          # Only an issue this workflow opened is ever updated or closed.
          number=$(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title,author |
              jq --raw-output --arg title "$TITLE" \
                '[.[] | select(.title == $title and .author.is_bot)][0].number // empty'
          )
          subject="Release $RELEASE_VERSION with Roc $NIGHTLY_TAG"
          if [ "$TEST_RESULT" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "$subject passes again: $RUN_URL"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "$subject still fails: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$subject failed: $RUN_URL

          The examples archive of a release is immutable, so the fix is a patch release that works with this compiler. This issue is updated by each failing run of the Nightly compatibility workflow and closed by the next passing one."
          fi
