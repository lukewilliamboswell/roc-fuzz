name: Release

# Builds what a release would contain, tests those exact bytes on every target,
# and publishes them once. A maintainer dispatches it from trunk with a version;
# a prerelease version such as 0.5.0-rc1 publishes a release candidate through
# the same steps. A pull request runs the same build and tests as a dry run,
# under the version 0.0.1-dry-run, and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version with matching docs/releases/VERSION.adoc, for example 0.5.0 or 0.5.0-rc1"
        required: true
        type: string
  pull_request:

# Each job states the permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # One run uses one compiler: the tag is resolved here and passed to every job.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Rejects a version whose tag or release already exists. Roc rejects
      # 0.0.0 in a package URL, so the dry run is 0.0.1-dry-run.
      - name: Validate the version
        id: validate
        uses: roc-lang/release-package/actions/validate-release@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          dry_run_version: 0.0.1-dry-run
          github_token: ${{ github.token }}

      - name: Require the default branch
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Releases must be dispatched from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Require matching release notes
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: |
          notes="docs/releases/$RELEASE_VERSION.adoc"
          if [ ! -s "$notes" ]; then
            echo "Every release and release candidate requires $notes" >&2
            exit 1
          fi

  # A pull request runs these two jobs in ci.yml. A release runs them on the
  # commit it is about to publish.
  check:
    name: Repository checks
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.0"
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}

      - name: Check the scripts, the platform and every target
        run: blueprint run check

  native-sanitizers:
    name: Native sanitizers
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.0"
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743

      - name: Build and run the pinned libFuzzer with AddressSanitizer
        run: blueprint run native-sanitizers

  # One builder cross-compiles the host for both targets around the locked
  # linker inputs and builds every asset once. Later jobs test and publish
  # these files and never rebuild them.
  build:
    name: Build the release assets
    needs: [resolve, validate]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.0"
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}

      - name: Read the Zig release
        id: dependencies
        run: echo "zig-version=$(jq -r .zig_version scripts/native-deps.json)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.dependencies.outputs.zig-version }}

      - name: Restore the content-addressed linker-input download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-cache/native-libraries
          key: linker-inputs-${{ hashFiles('native-libraries.lock.json') }}

      - name: Build both hosts around the reviewed linker inputs
        run: blueprint run build-platform -- --target x64musl --target arm64mac

      - name: Require the released linker inputs
        if: github.event_name == 'workflow_dispatch'
        run: blueprint run check-link-inputs

      - name: Bundle the platform
        run: blueprint run bundle -- --output-dir dist

      # Linker-input releases share this repository and are not platform API
      # baselines; the script selects the latest stable platform release.
      - name: Select the previous platform release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly-tag }}
        run: |
          blueprint run release-examples -- --operation resolve --repository "$GITHUB_REPOSITORY" \
            --compiler "$NIGHTLY_TAG" --output .release/previous-release.json
          echo "url=$(jq -er .bundle.url .release/previous-release.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -er .version .release/previous-release.json)" >> "$GITHUB_OUTPUT"

      - name: Report the bump this change needs
        if: github.event_name != 'workflow_dispatch'
        env:
          PREVIOUS_URL: ${{ steps.previous.outputs.url }}
        run: roc bump --old "$PREVIOUS_URL" platform/main.roc

      # A dry run skips this. A release fails here when the requested version
      # understates the change to the public API.
      - name: Check the version against the public API
        uses: roc-lang/release-package/actions/run-bump-check@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          release_version: ${{ needs.validate.outputs.release_version }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          previous_url: ${{ steps.previous.outputs.url }}
          bump_check: require
          bump_entrypoint: platform/main.roc

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-22.04", "macos-26"]'

      # The bundle's filename is its content hash and the tag is the version,
      # so the final URL is known before anything is published.
      - name: Package the examples archive
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly-tag }}
        run: |
          bundles=(.release/bundles/*.tar.zst)
          test "${#bundles[@]}" -eq 1
          blueprint run release-examples -- --operation package \
            --release-version "$RELEASE_VERSION" --source-sha "$GITHUB_SHA" --compiler "$NIGHTLY_TAG" \
            --platform-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_VERSION/$(basename "${bundles[0]}")" \
            --output ".release/assets/roc-fuzz-examples-$RELEASE_VERSION.zip"

      - name: Generate and validate the SPDX 2.3 SBOM
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          bundles=(.release/bundles/*.tar.zst)
          blueprint run sbom -- \
            --bundle "${bundles[0]}" \
            --release-version "$RELEASE_VERSION" \
            --library-manifest platform/targets/x64musl/NATIVE_LIBRARIES.json \
            --library-manifest platform/targets/arm64mac/NATIVE_LIBRARIES.json \
            --native-manifest x64musl=platform/targets/x64musl/SHA256SUMS \
            --native-manifest arm64mac=platform/targets/arm64mac/SHA256SUMS \
            --output ".release/assets/$(basename "${bundles[0]}").spdx.json"

      # A release renders its own notes. A dry run renders every notes file
      # newer than the previous release, so a mistake fails on the pull request.
      - name: Render the release notes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          PREVIOUS_RELEASE_VERSION: ${{ steps.previous.outputs.version }}
          RELEASE_NOTES_PATH: ${{ github.workspace }}/.release/notes/release-notes.md
          RELEASE_BUNDLES_PATH: ${{ github.workspace }}/.release/release-bundles.json
        run: |
          mkdir -p .release/notes
          blueprint run release-notes
          cat .release/notes/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundles
          path: .release/bundles/*.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Upload the examples archive and the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: .release/assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload the rendered release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: .release/notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Build the manual and the API reference
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.0"
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}

      - id: docs
        name: Build versioned HTML, PDF, and API documentation
        uses: lukewilliamboswell/roc-automation/actions/build-docs@26b692c5ce341efd5633793079d70c9e04559eac # 26b692c
        with:
          pdf-filename: roc-fuzz.pdf
          docs-version: ${{ needs.validate.outputs.release_version }}
          api-entrypoint: platform/main.roc
          roc-command: roc

      - name: Audit and archive the documentation
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          SITE: ${{ steps.docs.outputs.site-directory }}
          PDF: ${{ steps.docs.outputs.pdf-path }}
        run: |
          blueprint run check-docs -- "$SITE/api"
          mkdir -p release-docs
          cp "$PDF" "release-docs/roc-fuzz-$RELEASE_VERSION.pdf"
          (cd "$SITE" && zip -qr "$GITHUB_WORKSPACE/release-docs/roc-fuzz-docs-$RELEASE_VERSION.zip" .)

      - name: Upload the documentation archive and the manual
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-docs
          path: release-docs/*
          if-no-files-found: error
          retention-days: 7

  # Each target downloads the bundle and the examples archive the build job
  # made, serves the bundle on a loopback address, and runs the archived
  # examples against it. The files are unchanged; only the download location
  # differs for the duration of the test.
  test:
    name: Test the release assets (${{ matrix.os }})
    needs: [resolve, validate, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix and the verified blueprint binary
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b # 7fdb8be
        with:
          version: "0.4.0"
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697 # f5a74bf
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}

      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Download the examples archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: .release/assets

      - name: Unpack the examples archive
        run: blueprint run release-examples -- --operation unpack --archive .release/assets/*.zip --output .release/example-suite

      # An empty package cache, so the bundle is fetched and verified and not
      # found from an earlier run.
      - name: Run the archived examples against the bundle
        env:
          ROC_FUZZ_SUITE_ROOT: .release/example-suite
          XDG_CACHE_HOME: ${{ runner.temp }}/roc-release-cache
        uses: roc-lang/release-package/actions/test-bundle@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          test_bundle_command: blueprint run test-bundle --
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.validate.outputs.release_version }}

  attest:
    name: Attest the tested assets
    needs: [build, test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the tested bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download the tested examples archive and the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: .release/assets

      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            .release/bundles/*.tar.zst
            .release/assets/*.zip

      - name: Resolve the single SBOM file
        id: sbom-file
        run: |
          files=(.release/assets/*.spdx.json)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Attest the SPDX SBOM
        # sbom-path is a single file path, not a glob.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .release/bundles/*.tar.zst
          sbom-path: ${{ steps.sbom-file.outputs.path }}

      - name: Export attestations for offline verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .release/supply-chain
          for asset in .release/bundles/*.tar.zst .release/assets/*.zip; do
            work="$RUNNER_TEMP/attestations-$(basename "$asset")"
            mkdir -p "$work"
            (cd "$work" && gh attestation download "$GITHUB_WORKSPACE/$asset" --repo "$GITHUB_REPOSITORY")
            exported="$(find "$work" -maxdepth 1 -type f -name 'sha256*.jsonl')"
            if [ -z "$exported" ] || [ "$(wc -l <<< "$exported")" -ne 1 ]; then
              echo "Expected one exported attestation set for $asset" >&2
              exit 1
            fi
            cp "$exported" ".release/supply-chain/$(basename "$asset").intoto.jsonl"
          done

      - name: Upload the exported attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-supply-chain
          path: .release/supply-chain/*
          if-no-files-found: error
          retention-days: 7

  # The only job that can write. It checks out nothing and runs no repository
  # script: it downloads the tested artifacts of this run, stages them in a
  # draft release at the tested commit, downloads every asset back and compares
  # it with the tested file, and only then publishes.
  publish:
    name: Publish the release
    needs: [validate, check, native-sanitizers, build, docs, test, attest]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Download the tested bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: assets

      - name: Download the tested examples archive and the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: assets

      - name: Download the documentation archive and the manual
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-docs
          path: assets

      - name: Download the exported attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-supply-chain
          path: assets

      - name: Download the rendered release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: notes

      - name: Stage a draft, verify every asset, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "The tag $RELEASE_VERSION already exists; changed bytes are always a new version." >&2
            exit 1
          fi
          # A release candidate is a prerelease and is never the latest release.
          kind=(--prerelease=false --latest)
          if [ "$IS_PRERELEASE" = true ]; then
            kind=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "$RELEASE_VERSION" \
            --notes-file notes/release-notes.md
          gh release upload "$RELEASE_VERSION" assets/* --repo "$GITHUB_REPOSITORY"
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir published
          (cd assets && sha256sum -- * | sort) > tested.sha256
          (cd published && sha256sum -- * | sort) > published.sha256
          if ! diff tested.sha256 published.sha256; then
            echo "The draft's assets differ from the tested artifacts. The draft is left unpublished." >&2
            exit 1
          fi
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false "${kind[@]}"
          cat tested.sha256 >> "$GITHUB_STEP_SUMMARY"

  # A new release changes what the site leads with. The called workflow builds
  # the site in a read-only job and deploys that artifact from a job that holds
  # only the Pages permissions. A release candidate does not change the site.
  site:
    name: Rebuild the documentation site
    needs: [validate, publish]
    if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.is_prerelease != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  required:
    name: Release required
    if: always() && github.event_name == 'pull_request'
    needs: [validate, build, docs, test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every job of the dry run
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$RESULTS"
