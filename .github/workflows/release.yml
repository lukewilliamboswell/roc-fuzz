name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, for example 0.1.0 or 0.2.0-rc1"
        required: true
        type: string
  pull_request:

# Configure the minimum permissions on each job that needs them.
permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  release-info:
    name: Validate release request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Releases must be dispatched from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi

  native-inputs:
    name: Generate native inputs (${{ matrix.platform_target }})
    needs: release-info
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform_target: x64musl
          - os: macos-26
            platform_target: arm64mac
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
          use-cache: false

      - name: Generate and checksum native inputs
        run: python scripts/build_platform.py --target ${{ matrix.platform_target }}

      - name: Upload native inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.platform_target }}
          path: platform/targets/${{ matrix.platform_target }}
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and validate release bundle
    needs: [release-info, native-inputs]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install checksum-pinned Roc nightly
        run: |
          roc_bin_dir="$(python3 scripts/install_roc.py --install-dir "$RUNNER_TEMP/roc-nightly")"
          echo "$roc_bin_dir" >> "$GITHUB_PATH"

      - name: Download x64-musl inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: x64musl
          path: platform/targets/x64musl

      - name: Download Apple Silicon inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: arm64mac
          path: platform/targets/arm64mac

      - name: Validate source and unit tests
        run: python scripts/test.py --operation validate --verbose

      - name: Build and smoke-test every target
        run: python scripts/test.py --operation fuzz --max-total-time 1 --verbose

      - name: Resolve previous release
        if: github.event_name == 'workflow_dispatch'
        id: previous
        uses: roc-lang/release-package/actions/resolve-previous-release@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          github_token: ${{ github.token }}

      # This repository has no prior platform release. Change `warn` to
      # `require` after the first release establishes a roc bump baseline.
      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          release_version: ${{ needs.release-info.outputs.release_version }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          previous_url: ${{ steps.previous.outputs.previous_url }}
          bump_check: warn
          bump_entrypoint: platform/main.roc

      - name: Bundle platform
        run: python scripts/bundle.py --output-dir dist

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-22.04", "macos-26"]'

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Collect native input manifests
        run: |
          mkdir -p .release/native-inputs
          cp platform/targets/x64musl/SHA256SUMS .release/native-inputs/x64musl.SHA256SUMS
          cp platform/targets/arm64mac/SHA256SUMS .release/native-inputs/arm64mac.SHA256SUMS

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
            .release/native-inputs/*.SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test packaged platform (${{ matrix.os }})
    needs: [release-info, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install checksum-pinned Roc nightly
        run: |
          roc_bin_dir="$(python3 scripts/install_roc.py --install-dir "$RUNNER_TEMP/roc-nightly")"
          echo "$roc_bin_dir" >> "$GITHUB_PATH"

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Test release bundle
        uses: roc-lang/release-package/actions/test-bundle@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          test_bundle_command: python scripts/test_bundle.py
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.release-info.outputs.release_version }}

  generate-sbom:
    name: Generate release SBOM
    needs: [release-info, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download native input metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: .release/metadata

      - name: Generate and validate SPDX 2.3 metadata
        env:
          RELEASE_VERSION: ${{ needs.release-info.outputs.release_version }}
        run: |
          mkdir -p .release/sbom
          for bundle in .release/bundles/*.tar.zst; do
            python scripts/generate_sbom.py \
              --bundle "$bundle" \
              --release-version "$RELEASE_VERSION" \
              --native-manifest x64musl=.release/metadata/native-inputs/x64musl.SHA256SUMS \
              --native-manifest arm64mac=.release/metadata/native-inputs/arm64mac.SHA256SUMS \
              --output ".release/sbom/$(basename "$bundle").spdx.json"
          done

      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: .release/sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  build-docs:
    name: Build API docs archive
    needs: release-info
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install checksum-pinned Roc nightly
        run: |
          roc_bin_dir="$(python3 scripts/install_roc.py --install-dir "$RUNNER_TEMP/roc-nightly")"
          echo "$roc_bin_dir" >> "$GITHUB_PATH"

      - name: Create docs staging tree
        run: mkdir -p docs-site

      - name: Snapshot docs staging tree
        uses: roc-lang/release-package/actions/docs-snapshot@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          docs_root: docs-site

      - name: Generate documented API
        env:
          DOCS_VERSION: ${{ needs.release-info.outputs.docs_version }}
          ROC_DOCS_URL_ROOT: /${{ github.event.repository.name }}/${{ needs.release-info.outputs.docs_version }}
        run: |
          roc docs --output="docs-site/$DOCS_VERSION" platform/main.roc
          python3 scripts/check_docs.py "docs-site/$DOCS_VERSION"

      - name: Validate versioned docs
        uses: roc-lang/release-package/actions/docs-validate@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          docs_root: docs-site
          docs_version: ${{ needs.release-info.outputs.docs_version }}

      - name: Archive versioned docs
        env:
          DOCS_VERSION: ${{ needs.release-info.outputs.docs_version }}
        run: tar -czf docs.tar.gz -C docs-site "$DOCS_VERSION"

      - name: Upload docs archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-docs
          path: docs.tar.gz
          if-no-files-found: error
          retention-days: 7

  attest-release:
    name: Attest tested release bundle
    needs: [release-info, build, test-bundles, generate-sbom]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the tested release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download the release SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sbom
          path: .release/sbom

      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .release/bundles/*.tar.zst

      - name: Attest the SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .release/bundles/*.tar.zst
          sbom-path: .release/sbom/*.spdx.json

      - name: Export attestations for offline verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .release/supply-chain
          for bundle in .release/bundles/*.tar.zst; do
            work="$RUNNER_TEMP/attestations-$(basename "$bundle")"
            mkdir -p "$work"
            (cd "$work" && gh attestation download "$GITHUB_WORKSPACE/$bundle" --repo "$GITHUB_REPOSITORY")
            exported="$(find "$work" -maxdepth 1 -type f -name 'sha256*.jsonl')"
            if [ -z "$exported" ] || [ "$(wc -l <<< "$exported")" -ne 1 ]; then
              echo "Expected one exported attestation set for $bundle" >&2
              exit 1
            fi
            cp "$exported" ".release/supply-chain/$(basename "$bundle").intoto.jsonl"
          done
          cp .release/sbom/*.spdx.json .release/supply-chain/

      - name: Upload release supply-chain assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-supply-chain
          path: .release/supply-chain/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: [release-info, build, build-docs, test-bundles, attest-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: .release

      - name: Download docs archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: platform-docs

      - name: Download release supply-chain assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-supply-chain
          path: .release/supply-chain

      - name: List additional release assets
        id: additional-assets
        run: |
          {
            echo 'paths<<EOF'
            echo 'docs.tar.gz'
            find .release/supply-chain -maxdepth 1 -type f -print | sort
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          release_version: ${{ needs.release-info.outputs.release_version }}
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ needs.release-info.outputs.docs_version }}/
          github_token: ${{ github.token }}

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@48ccc909bd8f6ba60feb1d33d8b6ac1dc1c7af36 # main
        with:
          release_version: ${{ needs.release-info.outputs.release_version }}
          additional_assets: ${{ steps.additional-assets.outputs.paths }}
          github_token: ${{ github.token }}

  required:
    name: Release required
    if: always() && github.event_name == 'pull_request'
    needs: [release-info, native-inputs, build, test-bundles, build-docs, generate-sbom]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every release validation job
        env:
          RELEASE_INFO: ${{ needs.release-info.result }}
          NATIVE_INPUTS: ${{ needs.native-inputs.result }}
          BUILD: ${{ needs.build.result }}
          TEST_BUNDLES: ${{ needs.test-bundles.result }}
          BUILD_DOCS: ${{ needs.build-docs.result }}
          GENERATE_SBOM: ${{ needs.generate-sbom.result }}
        run: |
          test "$RELEASE_INFO" = success
          test "$NATIVE_INPUTS" = success
          test "$BUILD" = success
          test "$TEST_BUNDLES" = success
          test "$BUILD_DOCS" = success
          test "$GENERATE_SBOM" = success

  publish-docs:
    name: Publish versioned API docs
    needs: [release-info, publish-release]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      docs_artifact: platform-docs
      docs_version: ${{ needs.release-info.outputs.docs_version }}
