name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, for example 0.1.0 or 0.2.0-rc1"
        required: true
        type: string
  pull_request:

# Configure the minimum permissions on each job that needs them.
permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  release-info:
    name: Validate release request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      roc_nightly: ${{ steps.roc-version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pinned Roc nightly
        id: roc-version
        run: |
          set -euo pipefail
          tag="$(sed -n '1p' .roc-version)"
          if [ -z "$tag" ] || [ "$(wc -l < .roc-version)" -ne 1 ]; then
            echo ".roc-version must contain exactly one nightly tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Releases must be dispatched from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi

  compiler:
    name: Build Roc coverage compiler
    needs: release-info
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout Roc coverage compiler
        uses: actions/checkout@v7
        with:
          repository: roc-lang/roc
          ref: refs/pull/10657/head
          path: roc-compiler

      - name: Install Zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
        with:
          version: "0.16.0"

      - name: Build Roc
        run: zig build roc
        working-directory: roc-compiler

      - name: Archive compiler
        run: tar -czf roc-compiler.tar.gz -C roc-compiler/zig-out/bin roc

      - name: Upload compiler
        uses: actions/upload-artifact@v7
        with:
          name: roc-coverage-compiler
          path: roc-compiler.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and validate release bundle
    needs: [release-info, compiler]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      ROC: ${{ github.workspace }}/.release/compiler/roc
      # The coverage compiler is the intentional development build tracked by
      # roc-lang/roc#10657 until that work is available in a pinned nightly.
      ROC_ALLOW_UNPINNED: "1"
    outputs:
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download compiler
        uses: actions/download-artifact@v8
        with:
          name: roc-coverage-compiler
          path: .release/compiler

      - name: Extract compiler
        run: tar -xzf .release/compiler/roc-compiler.tar.gz -C .release/compiler

      - name: Validate source and unit tests
        run: python scripts/test.py --operation validate --verbose

      - name: Build and smoke-test every target
        run: python scripts/test.py --operation fuzz --max-total-time 1 --verbose

      - name: Resolve previous release
        if: github.event_name == 'workflow_dispatch'
        id: previous
        uses: roc-lang/release-package/actions/resolve-previous-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          github_token: ${{ github.token }}

      # This repository has no prior platform release. Change `warn` to
      # `require` after the first release establishes a roc bump baseline.
      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.release-info.outputs.release_version }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          previous_url: ${{ steps.previous.outputs.previous_url }}
          bump_check: warn
          bump_entrypoint: platform/main.roc

      - name: Bundle platform
        run: python scripts/bundle.py --output-dir dist

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-22.04"]'

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test packaged platform (${{ matrix.os }})
    needs: [release-info, compiler, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}
    env:
      ROC: ${{ github.workspace }}/.release/compiler/roc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download compiler
        uses: actions/download-artifact@v8
        with:
          name: roc-coverage-compiler
          path: .release/compiler

      - name: Extract compiler
        run: tar -xzf .release/compiler/roc-compiler.tar.gz -C .release/compiler

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Test release bundle
        uses: roc-lang/release-package/actions/test-bundle@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          test_bundle_command: python scripts/test_bundle.py
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.release-info.outputs.release_version }}

  build-docs:
    name: Build API docs archive
    needs: release-info
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.release-info.outputs.roc_nightly }}

      - name: Create docs staging tree
        run: mkdir -p docs-site

      - name: Snapshot docs staging tree
        uses: roc-lang/release-package/actions/docs-snapshot@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: docs-site

      - name: Generate documented API
        env:
          DOCS_VERSION: ${{ needs.release-info.outputs.docs_version }}
          ROC_DOCS_URL_ROOT: /${{ github.event.repository.name }}/${{ needs.release-info.outputs.docs_version }}
        run: |
          roc docs --output="docs-site/$DOCS_VERSION" platform/main.roc
          python3 scripts/check_docs.py "docs-site/$DOCS_VERSION"

      - name: Validate versioned docs
        uses: roc-lang/release-package/actions/docs-validate@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: docs-site
          docs_version: ${{ needs.release-info.outputs.docs_version }}

      - name: Archive versioned docs
        env:
          DOCS_VERSION: ${{ needs.release-info.outputs.docs_version }}
        run: tar -czf docs.tar.gz -C docs-site "$DOCS_VERSION"

      - name: Upload docs archive
        uses: actions/upload-artifact@v7
        with:
          name: platform-docs
          path: docs.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: [release-info, build, build-docs, test-bundles]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: .release

      - name: Download docs archive
        uses: actions/download-artifact@v8
        with:
          name: platform-docs

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.release-info.outputs.release_version }}
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ needs.release-info.outputs.docs_version }}/
          github_token: ${{ github.token }}

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@48ccc909bd8f6ba60feb1d33d8b6ac1dc1c7af36
        with:
          release_version: ${{ needs.release-info.outputs.release_version }}
          additional_assets: docs.tar.gz
          github_token: ${{ github.token }}

  publish-docs:
    name: Publish versioned API docs
    needs: [release-info, publish-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download docs archive
        uses: actions/download-artifact@v8
        with:
          name: platform-docs

      - name: Restore released docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/restore_release_docs.sh www

      - name: Snapshot existing docs
        uses: roc-lang/release-package/actions/docs-snapshot@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: www

      - name: Install current docs archive
        run: tar -xzf docs.tar.gz -C www

      - name: Update docs index
        uses: roc-lang/release-package/actions/docs-index@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: www
          docs_version: ${{ needs.release-info.outputs.docs_version }}

      - name: Validate Pages tree
        uses: roc-lang/release-package/actions/docs-validate@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: www
          docs_version: ${{ needs.release-info.outputs.docs_version }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: www

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
