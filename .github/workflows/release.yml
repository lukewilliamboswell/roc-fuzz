name: Release

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Publish a branch RC; excludes Pages and default-branch follow-up
        type: boolean
        default: false
      expected_sha:
        description: Full source commit required for explicit RC publication
        type: string
        required: false
      nightly_validation:
        description: Validate without publishing, follow-ups or deployment
        type: boolean
        default: false
      release_version:
        description: "Release version with matching docs/releases/VERSION.adoc, for example 0.4.0 or 0.5.0-rc1"
        required: false
        type: string
  pull_request:

# Configure the minimum permissions on each job that needs them.
permissions: {}

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}

jobs:
  native-sanitizers:
    name: Native sanitizers
    needs: release-info
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: nightly-2026-09-18-1d982dc
          nightly-tag: nightly-2026-09-22-e494788

      - name: Build and run the pinned libFuzzer with AddressSanitizer
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
        run: |
          "$ROC_STABLE" --opt=dev scripts/test_native_sanitizers.roc

  release-info:
    name: Validate release request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: nightly-2026-09-18-1d982dc
          nightly-tag: nightly-2026-09-22-e494788

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && !inputs.nightly_validation && inputs.release_version || '' }}
          dry_run: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}
          github_token: ${{ github.token }}

      - name: Check compiler release policy
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation && !inputs.release_candidate
        uses: lukewilliamboswell/roc-automation/actions/check-release@e5b83ace37e0d0cb4e9fadb93cefb364f2cd6611 # e5b83ac
        with:
          version: ${{ inputs.release_version }}
          compiler-root: platform/main.roc
          allow-default-branch: 'true'
          allow-nightly-bootstrap: 'true'

      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation && !inputs.release_candidate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Releases must be dispatched from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Require matching release notes
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: |
          notes="docs/releases/$RELEASE_VERSION.adoc"
          if [ ! -s "$notes" ]; then
            echo "Every stable or release-candidate publication requires $notes" >&2
            exit 1
          fi

      - name: Validate explicit release candidate source
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation && inputs.release_candidate
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: |
          scripts/validate_release_candidate.roc
          scripts/check_supply_chain.roc

  native-inputs:
    name: Prepare locked native inputs (${{ matrix.platform_target }})
    needs: release-info
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform_target: x64musl
          - os: macos-26
            platform_target: arm64mac
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read workspace dependencies
        id: dependencies
        run: echo "zig-version=$(jq -r .zig_version scripts/workspace-deps.json)" >> "$GITHUB_OUTPUT"

      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: nightly-2026-09-18-1d982dc
          nightly-tag: nightly-2026-09-22-e494788

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.dependencies.outputs.zig-version }}

      - name: Resolve the reviewed linker-input identity
        id: linker-inputs
        env:
          TARGET: ${{ matrix.platform_target }}
        run: echo "identity=$(python3 scripts/link_input_artifacts.py cache-identity --target "$TARGET")" >> "$GITHUB_OUTPUT"

      - name: Restore the content-addressed linker-input download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .test-cache/native-libraries
          key: linker-inputs-${{ matrix.platform_target }}-${{ steps.linker-inputs.outputs.identity }}

      - name: Prepare host and reviewed linker inputs
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
          TARGET: ${{ matrix.platform_target }}
        run: scripts/build_platform.roc -- --target "$TARGET"

      - name: Upload native inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.platform_target }}
          path: platform/targets/${{ matrix.platform_target }}
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and validate release bundle
    needs: [release-info, native-inputs]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: nightly-2026-09-18-1d982dc
          nightly-tag: nightly-2026-09-22-e494788

      - name: Download x64-musl inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: x64musl
          path: platform/targets/x64musl

      - name: Download Apple Silicon inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: arm64mac
          path: platform/targets/arm64mac

      - name: Bundle platform
        if: github.event_name != 'workflow_dispatch' || inputs.nightly_validation || inputs.release_candidate
        env: &roc-environment
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: scripts/build_bundle.roc -- --output-dir dist

      - name: Require released libraries and bundle for publication
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation && !inputs.release_candidate
        env: *roc-environment
        run: |
          scripts/check_native_libraries.roc
          scripts/build_bundle.roc -- --output-dir dist

      - name: Validate candidate release bundle
        env: *roc-environment
        run: scripts/test_bundle.roc -- dist/*.tar.zst

      - name: Resolve previous release
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        id: previous
        uses: roc-lang/release-package/actions/resolve-previous-release@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          github_token: ${{ github.token }}

      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          release_version: ${{ needs.release-info.outputs.release_version }}
          dry_run: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}
          previous_url: ${{ steps.previous.outputs.previous_url }}
          bump_check: require
          bump_entrypoint: platform/main.roc

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-22.04", "macos-26"]'

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Collect native input manifests
        run: |
          mkdir -p .release/native-inputs
          cp platform/targets/x64musl/SHA256SUMS .release/native-inputs/x64musl.SHA256SUMS
          cp platform/targets/arm64mac/SHA256SUMS .release/native-inputs/arm64mac.SHA256SUMS
          for target in x64musl arm64mac; do
            if test -f "platform/targets/$target/NATIVE_LIBRARIES.json"; then
              cp "platform/targets/$target/NATIVE_LIBRARIES.json" ".release/native-inputs/$target.NATIVE_LIBRARIES.json"
            fi
          done

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
            .release/native-inputs/*.SHA256SUMS
            .release/native-inputs/*.NATIVE_LIBRARIES.json
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test packaged platform (${{ matrix.os }})
    needs: [release-info, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: nightly-2026-09-18-1d982dc
          nightly-tag: nightly-2026-09-22-e494788

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Test release bundle
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        uses: roc-lang/release-package/actions/test-bundle@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          test_bundle_command: scripts/test_bundle.roc --
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.release-info.outputs.release_version }}

  generate-sbom:
    name: Generate release SBOM
    needs: [release-info, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: nightly-2026-09-18-1d982dc
          nightly-tag: nightly-2026-09-22-e494788

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download native input metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: .release/metadata

      - name: Generate and validate SPDX 2.3 metadata
        env:
          RELEASE_VERSION: ${{ needs.release-info.outputs.release_version }}
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: |
          mkdir -p .release/sbom
          library_args=()
          for manifest in .release/metadata/native-inputs/*.NATIVE_LIBRARIES.json; do
            if test -f "$manifest"; then library_args+=(--library-manifest "$manifest"); fi
          done
          for bundle in .release/bundles/*.tar.zst; do
            scripts/build_release_sbom.roc -- \
              --bundle "$bundle" \
              --release-version "$RELEASE_VERSION" \
              "${library_args[@]}" \
              --native-manifest x64musl=.release/metadata/native-inputs/x64musl.SHA256SUMS \
              --native-manifest arm64mac=.release/metadata/native-inputs/arm64mac.SHA256SUMS \
              --output ".release/sbom/$(basename "$bundle").spdx.json"
          done

      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: .release/sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  build-docs:
    name: Build release manual and API docs
    needs: release-info
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: nightly-2026-09-18-1d982dc
          nightly-tag: nightly-2026-09-22-e494788

      - id: docs
        name: Build versioned HTML, PDF, and API documentation
        uses: lukewilliamboswell/roc-automation/actions/build-docs@a2b4d8abc967952b59fc751345efd144cbc0fbfc # a2b4d8a
        with:
          pdf-filename: roc-fuzz.pdf
          docs-version: ${{ needs.release-info.outputs.release_version || 'unreleased' }}
          api-entrypoint: platform/main.roc
          roc-command: ${{ steps.roc.outputs.nightly-executable }}

      - name: Audit and archive release documentation
        env:
          DOCS_VERSION: ${{ needs.release-info.outputs.release_version || 'unreleased' }}
          SITE: ${{ steps.docs.outputs.site-directory }}
          PDF: ${{ steps.docs.outputs.pdf-path }}
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: |
          scripts/check_docs.roc -- "$SITE/api"
          mkdir -p release-docs
          cp "$PDF" "release-docs/roc-fuzz-$DOCS_VERSION.pdf"
          (cd "$SITE" && zip -qr "$GITHUB_WORKSPACE/release-docs/roc-fuzz-docs-$DOCS_VERSION.zip" .)

      - name: Upload release documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-docs
          path: release-docs/*
          if-no-files-found: error
          retention-days: 7

  attest-release:
    name: Attest tested release bundle
    needs: [release-info, build, test-bundles, generate-sbom]
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the tested release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download the release SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sbom
          path: .release/sbom

      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .release/bundles/*.tar.zst

      - name: Resolve the single SBOM file
        id: sbom-file
        run: |
          files=(.release/sbom/*.spdx.json)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Attest the SPDX SBOM
        # sbom-path is a single file path, not a glob.
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .release/bundles/*.tar.zst
          sbom-path: ${{ steps.sbom-file.outputs.path }}

      - name: Export attestations for offline verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .release/supply-chain
          for bundle in .release/bundles/*.tar.zst; do
            work="$RUNNER_TEMP/attestations-$(basename "$bundle")"
            mkdir -p "$work"
            (cd "$work" && gh attestation download "$GITHUB_WORKSPACE/$bundle" --repo "$GITHUB_REPOSITORY")
            exported="$(find "$work" -maxdepth 1 -type f -name 'sha256*.jsonl')"
            if [ -z "$exported" ] || [ "$(wc -l <<< "$exported")" -ne 1 ]; then
              echo "Expected one exported attestation set for $bundle" >&2
              exit 1
            fi
            cp "$exported" ".release/supply-chain/$(basename "$bundle").intoto.jsonl"
          done
          cp .release/sbom/*.spdx.json .release/supply-chain/

      - name: Upload release supply-chain assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-supply-chain
          path: .release/supply-chain/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: [release-info, native-sanitizers, build, build-docs, test-bundles, attest-release]
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369 # stable-and-nightly fork
        with:
          version: stable-and-nightly
          stable-tag: nightly-2026-09-18-1d982dc
          nightly-tag: nightly-2026-09-22-e494788

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: .release

      - name: Download release documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: platform-docs
          path: .release/docs

      - name: Download release supply-chain assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-supply-chain
          path: .release/supply-chain

      - name: List additional release assets
        id: additional-assets
        run: |
          {
            echo 'paths<<EOF'
            find .release/docs -maxdepth 1 -type f -print | sort
            find .release/supply-chain -maxdepth 1 -type f -print | sort
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@d2560ead9f724bfaabfbc8134b8895e120171064 # main
        with:
          release_version: ${{ needs.release-info.outputs.release_version }}
          release_notes_command: scripts/render_release_notes.roc
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          github_token: ${{ github.token }}

      - name: Publish release
        if: '!inputs.release_candidate'
        uses: roc-lang/release-package/actions/publish-release@48ccc909bd8f6ba60feb1d33d8b6ac1dc1c7af36 # main
        with:
          release_version: ${{ needs.release-info.outputs.release_version }}
          additional_assets: ${{ steps.additional-assets.outputs.paths }}
          github_token: ${{ github.token }}

      - name: Publish tested RC without changing the stable release
        if: inputs.release_candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        run: |
          set -euo pipefail
          scripts/validate_release_candidate.roc
          # gh release create refuses an existing release; refuse an existing tag too.
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_VERSION")"
          test "$(jq --arg tag "refs/tags/$RELEASE_VERSION" '[.[] | select(.ref == $tag)] | length' <<< "$refs")" -eq 0
          gh release create "$RELEASE_VERSION" .release/bundles/*.tar.zst .release/supply-chain/* .release/docs/* --target "$GITHUB_SHA" --prerelease --latest=false --title "$RELEASE_VERSION" --notes-file .release/release-notes.md

  required:
    name: Release required
    if: always() && (github.event_name == 'pull_request' || inputs.nightly_validation)
    needs: [release-info, native-sanitizers, native-inputs, build, test-bundles, build-docs, generate-sbom]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every release validation job
        env:
          RELEASE_INFO: ${{ needs.release-info.result }}
          NATIVE_SANITIZERS: ${{ needs.native-sanitizers.result }}
          NATIVE_INPUTS: ${{ needs.native-inputs.result }}
          BUILD: ${{ needs.build.result }}
          TEST_BUNDLES: ${{ needs.test-bundles.result }}
          BUILD_DOCS: ${{ needs.build-docs.result }}
          GENERATE_SBOM: ${{ needs.generate-sbom.result }}
        run: |
          test "$RELEASE_INFO" = success
          test "$NATIVE_SANITIZERS" = success
          test "$NATIVE_INPUTS" = success
          test "$BUILD" = success
          test "$TEST_BUNDLES" = success
          test "$BUILD_DOCS" = success
          test "$GENERATE_SBOM" = success
