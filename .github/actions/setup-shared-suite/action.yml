name: Build reviewed shared suite tester
description: Compile the shared archive tester with its own tooling compiler before installing the project nightly
outputs:
  executable:
    description: Shared release-package executable
    value: ${{ runner.temp }}/roc-fuzz-shared-suite
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: lukewilliamboswell/roc-automation
        ref: acc5efdcd929b38e665cd3ae6e694d1c4887f9c7
        path: .test-cache/shared-automation
        persist-credentials: false
    - id: tooling
      uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@acc5efdcd929b38e665cd3ae6e694d1c4887f9c7 # acc5efd
      with:
        nightly-tag: nightly-2026-10-09-258ab27
    - shell: bash
      env:
        TOOLING_ROC: ${{ steps.tooling.outputs.roc }}
      run: |
        set -euo pipefail
        "$TOOLING_ROC" build .test-cache/shared-automation/scripts/release_package.roc --output="$RUNNER_TEMP/roc-fuzz-shared-suite"
